name: Update AUP Data

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 */3 * * *'  # Каждые 3 часа

permissions:
  contents: write  # Требуется для git push

jobs:
  update-aup:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: ▶️ Run aup_upload.py
        env:
          XML_DATA_URL: ${{ secrets.XML_DATA_URL }}
          USE_PROXY: ${{ secrets.USE_PROXY }}  # Должен быть "true" или "false"
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: python aup_upload.py

      - name: ✅ Verify output.json
        run: |
          if [[ ! -f output.json ]]; then
            echo "❌ output.json не создан"
            exit 1
          fi
          if [[ ! -s output.json ]]; then
            echo "❌ output.json пуст"
            exit 1
          fi
          echo "✅ output.json успешно создан:"
          cat output.json

      - name: 💾 Commit and push output.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output.json
          git diff --staged --quiet || git commit -m "chore: update AUP data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: 📤 Upload as artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: aup-output
          path: output.json
